<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>DigUp</title>
<link rel="stylesheet" href="ui.css">
<body class="popup">
  <header>
    <input id="q" type="search" placeholder="Describe what you're looking for" autocomplete="off" spellcheck="false">
    <button id="expand" class="icon-button" title="Open in a tab">⤢</button>
    <button id="settings" class="icon-button" title="Settings">⚙</button>
  </header>
  <nav id="filters"></nav>
  <ul id="results"></ul>
  <footer id="status"></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
